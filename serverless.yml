service: cita-medica-lambda

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  environment:
    NODE_ENV: ${self:provider.stage}
    APPOINTMENTS_TABLE: ${self:service}-${self:provider.stage}
    SNS_TOPIC_ARN: !Ref MedicalAppointmentsTopic
    EVENT_BUS_NAME: !Ref AppointmentEventBus
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "arn:aws:logs:*:*:*"
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Scan
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
          Resource: 
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-${self:provider.stage}/index/*"
        - Effect: Allow
          Action:
            - sns:Publish
          Resource: !Ref MedicalAppointmentsTopic
        - Effect: Allow
          Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            - !GetAtt PeruQueue.Arn
            - !GetAtt ChileQueue.Arn
            - !GetAtt CompletionQueue.Arn
        - Effect: Allow
          Action:
            - events:PutEvents
          Resource: !GetAtt AppointmentEventBus.Arn

plugins:
  - serverless-plugin-typescript
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3002
  typescript:
    tsConfigFile: tsconfig.json

functions:
  Appointment:
    handler: src/handlers/appointment.handler
    events:
      - http:
          path: appointments
          method: post
          cors: true
      - http:
          path: appointments-by-client/{id}
          method: get
          cors: true
      - http:
          path: appointments/{id}
          method: get
          cors: true 
      - sqs:
          arn: !GetAtt CompletionQueue.Arn
          batchSize: 1

  AppointmentPE:
    handler: src/handlers/appointment-pe.handler
    events:
      - sqs:
          arn: !GetAtt PeruQueue.Arn
          batchSize: 1

  AppointmentCL:
    handler: src/handlers/appointment-cl.handler
    events:
      - sqs:
          arn: !GetAtt ChileQueue.Arn
          batchSize: 1

resources:
  Resources:
    AppointmentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    # SNS Topic para notificaciones de citas médicas
    MedicalAppointmentsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: sns_medical
        DisplayName: Medical Appointments Notifications

    # EventBridge Bus para eventos de confirmación
    AppointmentEventBus:
      Type: AWS::Events::EventBus
      Properties:
        Name: appointment-confirmation-bus

    # Dead Letter Queues
    PeruDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: sqs_pe_dlq

    ChileDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: sqs_cl_dlq

    # Cola SQS para Perú
    PeruQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: sqs_pe
        VisibilityTimeout: 30
        MessageRetentionPeriod: 1209600
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt PeruDLQ.Arn
          maxReceiveCount: 3

    # Cola SQS para Chile
    ChileQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: sqs_cl
        VisibilityTimeout: 30
        MessageRetentionPeriod: 1209600
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ChileDLQ.Arn
          maxReceiveCount: 3

    # Cola SQS para confirmaciones de completado
    CompletionQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: sqs_completion
        VisibilityTimeout: 30
        MessageRetentionPeriod: 1209600

    # Regla de EventBridge para Perú
    PeruEventRule:
      Type: AWS::Events::Rule
      Properties:
        EventBusName: !Ref AppointmentEventBus
        Name: peru-appointment-confirmed
        Description: Rule to capture Peru appointment confirmations
        EventPattern:
          source:
            - "cita-medica.peru"
          detail-type:
            - "AppointmentConfirmed"
        Targets:
          - Arn: !GetAtt CompletionQueue.Arn
            Id: PeruCompletionTarget

    # Regla de EventBridge para Chile
    ChileEventRule:
      Type: AWS::Events::Rule
      Properties:
        EventBusName: !Ref AppointmentEventBus
        Name: chile-appointment-confirmed
        Description: Rule to capture Chile appointment confirmations
        EventPattern:
          source:
            - "cita-medica.chile"
          detail-type:
            - "AppointmentConfirmed"
        Targets:
          - Arn: !GetAtt CompletionQueue.Arn
            Id: ChileCompletionTarget

    # Permisos para que EventBridge pueda enviar a SQS
    CompletionQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref CompletionQueue
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt CompletionQueue.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !GetAtt PeruEventRule.Arn
            - Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt CompletionQueue.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !GetAtt ChileEventRule.Arn 